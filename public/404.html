<!DOCTYPE html>
<html>

<head>
  <title>We can’t find that (404)</title>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      --lch-black: 0% 0 0;
      --lch-gray: 75% 0.005 96;
      --lch-white: 100% 0 0;

      --color-border: oklch(var(--lch-gray));
      --color-bg: oklch(var(--lch-white));
      --color-text: oklch(var(--lch-black));

      --btn-size: 2.65em;

      background-color: var(--color-bg);
      block-size: 100dvh;
      color: var(--color-text);
      display: grid;
      margin: 0;
      padding: 0;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";

      @media (prefers-color-scheme: dark) {
        --lch-black: 100% 0 0;
        --lch-gray: 44.95% 0 0;
        --lch-white: 0% 0 0;
      }
    }

    svg {
      fill: var(--color-text);

      @media (prefers-color-scheme: dark) {
        fill: var(--color-text);
      }
    }

    .error {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 2em;
      justify-content: start;
      margin-block-end: 15dvh;
    }

    .error__img {
      aspect-ratio: 1;
      background-color: var(--color-text);
      block-size: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      inline-size: 30dvh;

      svg {
        fill: var(--color-bg);
        grid-area: 1/1;
        max-inline-size: 66%;

        @media (prefers-color-scheme: dark) {
          fill: var(--color-bg);
        }
      }
    }

    .buttons {
      display: flex;
      flex-direction: row;
      gap: 1em;
      justify-content: center;
    }

    .btn {
      align-items: center;
      aspect-ratio: 1;
      background-color: var(--color-bg);
      block-size: var(--btn-size);
      border-radius: 50%;
      border: 1px solid var(--color-border);
      color: var(--color-text);
      cursor: pointer;
      display: grid;
      font-weight: 600;
      font-size: 1.4rem;
      gap: 0.5em;
      inline-size: var(--btn-size);
      justify-content: center;
      padding: 0;
      place-items: center;
      text-align: center;

      svg {
        -webkit-touch-callout: none;
        grid-area: 1/1;
        inline-size: 1.3em;
        max-inline-size: unset;
        user-select: none;
      }
    }

    .for-screen-reader {
      clip-path: inset(50%);
      height: 1px;
      width: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
    }


      body {
        --color-bg: hsl(40 30% 96%);
        --color-text: hsl(330 10% 17%);
        --color-border: hsl(30 20% 78%);
        --color-brand: hsl(348 70% 35%);
        background-image: radial-gradient(ellipse at top, hsl(20 45% 92%), transparent 70%);
        font-size: 1rem;
        line-height: 1.4;
        min-block-size: 100dvh;
        block-size: auto;
        padding: 2rem;
      }
      .error { gap: 1.25rem; margin: 0; max-inline-size: 40ch; text-align: center; }
      .error__img { background-color: var(--color-brand); inline-size: 6rem; padding: 1.5rem; }
      .error__img svg { fill: hsl(40 30% 96%); max-inline-size: 100%; }
      .error h1 { font-size: 1.75rem; line-height: 1.25; margin: 0; }
      .error p { margin: 0; }
      .error .brand { color: var(--color-brand); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .btn:focus-visible { outline: 3px solid var(--color-brand); outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        body { --color-bg: hsl(330 12% 9%); --color-text: hsl(40 20% 90%); --color-border: hsl(30 12% 58%); --color-brand: hsl(348 68% 58%); background-image: none; }
        .error__img svg { fill: hsl(330 12% 9%); }
      }
    </style>
</head>

<body>

        <path

    </div>
    <a href="/" class="btn" autofocus="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="m21.864 9.5h-11.607a.25.25 0 0 1 -.174-.43l3.864-3.721a2.609 2.609 0 0 0 -.075-3.682 2.612 2.612 0 0 0 -3.68-.077l-9.792 9.699a1 1 0 0 0 -.008 1.411l9.625 9.724a2.66 2.66 0 0 0 3.755-3.757l-3.729-3.733a.25.25 0 0 1 .177-.427h11.673c1.556 0 2-1.675 2-2.51a2.28 2.28 0 0 0 -2.029-2.497z" />
      </svg>
      <span class="for-screen-reader">Go back</span>

  </div>
</body>

</html>
