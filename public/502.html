<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Starting Campfire…</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <style>
      * { box-sizing: border-box; }
      body { background: hsl(40 30% 96%); color: hsl(330 10% 17%); display: grid; min-block-size: 100dvh; margin: 0; padding: 2rem; place-items: center; font-family: -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", sans-serif; line-height: 1.4; }
      main { max-inline-size: 38ch; text-align: center; }
      .brand { color: hsl(348 70% 35%); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { font-size: 1.75rem; line-height: 1.25; }
      .track { background: hsl(20 45% 92%); border-radius: 1rem; block-size: 0.25rem; overflow: hidden; margin: 2rem auto; inline-size: 8rem; }
      .track::before { animation: arriving 2s ease-in-out infinite; background: hsl(348 70% 35%); border-radius: inherit; content: ""; display: block; block-size: 100%; inline-size: 50%; }
      @keyframes arriving { 50% { transform: translateX(100%); } }
      @media (prefers-color-scheme: dark) { body { background: hsl(330 12% 9%); color: hsl(40 20% 90%); } .brand { color: hsl(348 68% 58%); } .track { background: hsl(330 12% 18%); } .track::before { background: hsl(348 68% 58%); } }
      @media (prefers-reduced-motion: reduce) { .track::before { animation: none; margin-inline: auto; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Deccan Queen on Rails · Campfire</p>
      <h1>Getting ready to welcome you aboard</h1>
      <div class="track" aria-hidden="true"></div>
      <p role="status">Campfire is starting. This page will check again shortly.</p>
    </main>
    <script>setTimeout(() => location.reload(), 10000)</script>
  </body>
</html>
